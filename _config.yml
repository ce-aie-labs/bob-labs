title: IBM Bob Labs
description: A playbook for replacing repetitive work with Bob, validated through a hackathon.
url: "https://ce-aie-labs.github.io"
baseurl: "/bob-labs"

collections:
  labs_en:
    output: true
    permalink: /en/labs/:path/
  labs_ko:
    output: true
    permalink: /ko/labs/:path/

defaults:
  - scope:
      path: ""
      type: labs_en
    values:
      layout: lab
  - scope:
      path: ""
      type: labs_ko
    values:
      layout: lab
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - DESIGN.md
  - NOTE.md
  - docs
  # Build/config helpers, and any future lab attachments, are not part of the
  # published site. The Java lab fixture lives on the lab-assets GitHub Release,
  # not in this repo.
  - attachments
  - script
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - ".github"

plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
