<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PetClinic — 살아있나?</title>
<style>
  :root { --blue:#0f62fe; --line:#e0e0e0; --ink:#161616; --gray:#525252; }
  * { box-sizing:border-box; }
  body { font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; color:var(--ink);
         margin:0; padding:48px 32px; max-width:960px; }
  h1 { font-weight:300; font-size:42px; margin:0 0 4px; }
  p.sub { color:var(--gray); margin:0 0 32px; }
  #status { border:1px solid var(--line); border-left:4px solid var(--line);
            padding:20px 24px; margin-bottom:32px; }
  #status.ok   { border-left-color:#24a148; }
  #status.fail { border-left-color:#da1e28; }
  #status .big { font-size:24px; font-weight:300; }
  #status .detail { color:var(--gray); font-size:14px; margin-top:6px; font-family:"IBM Plex Mono",monospace; }
  h2 { font-weight:400; font-size:16px; text-transform:uppercase; letter-spacing:.4px;
       color:var(--gray); margin:32px 0 8px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th { text-align:left; font-weight:600; border-bottom:1px solid var(--ink); padding:10px 12px; }
  td { border-bottom:1px solid var(--line); padding:10px 12px; }
  code { background:#f4f4f4; padding:2px 6px; font-family:"IBM Plex Mono",monospace; }
</style>
</head>
<body>
<h1>PetClinic</h1>
<p class="sub">이 화면에 데이터가 뜨면 앱이 실제로 돌고 있는 것입니다.</p>

<div id="status"><span class="big">확인 중…</span></div>

<div id="content" hidden>
  <h2>수의사</h2>
  <table><thead><tr><th>이름</th><th>전공</th></tr></thead><tbody id="vets"></tbody></table>
  <h2>반려동물 주인</h2>
  <table><thead><tr><th>이름</th><th>도시</th><th>전화</th></tr></thead><tbody id="owners"></tbody></table>
</div>

<script>
const BASE = "http://localhost:9966/petclinic/api";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function check() {
  const t0 = performance.now();
  try {
    const [vets, owners] = await Promise.all([
      fetch(BASE + "/vets").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
      fetch(BASE + "/owners").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    ]);
    const ms = Math.round(performance.now() - t0);
    $("status").className = "ok";
    $("status").innerHTML = '<span class="big">앱이 응답합니다</span>'
      + '<div class="detail">HTTP 200 · ' + ms + 'ms · 수의사 ' + vets.length + '명 · 주인 ' + owners.length + '명</div>';
    $("vets").innerHTML = vets.map(v =>
      "<tr><td>" + esc(v.firstName + " " + v.lastName) + "</td><td>"
      + esc(v.specialties.map(s => s.name).join(", ") || "—") + "</td></tr>").join("");
    $("owners").innerHTML = owners.map(o =>
      "<tr><td>" + esc(o.firstName + " " + o.lastName) + "</td><td>" + esc(o.city)
      + "</td><td>" + esc(o.telephone) + "</td></tr>").join("");
    $("content").hidden = false;
  } catch (e) {
    $("status").className = "fail";
    $("status").innerHTML = '<span class="big">앱이 응답하지 않습니다</span>'
      + '<div class="detail">' + esc(e.message) + ' — <code>java -jar petclinic-legacy.jar</code> 로 앱을 먼저 띄우세요</div>';
    $("content").hidden = true;
  }
}
check();
setInterval(check, 3000);
</script>
</body>
</html>
